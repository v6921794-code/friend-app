services:
  - type: web
    name: friend-app-1
    runtime: node
    buildCommand: npm ci
    startCommand: node server.js
    autoDeploy: yes
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: friend-app-db
          property: connectionString
